<footer class="siteFooter">
  <div class="siteFooterMain">
    <a class="siteFooterBrand" href="index.html">
      <img src="brand/icon.svg?v=clock" alt="" width="20" height="20" />
      Clock Explorer
    </a>
    <p class="siteFooterTagline">$tagline</p>
    <nav class="siteFooterLinks" aria-label="$project_links">
      <a
        href="https://github.com/qhuang20/clock-explorer"
        target="_blank"
        rel="noopener"
        >GitHub <span aria-hidden="true">↗</span></a
      >
      <a
        href="https://github.com/qhuang20/clock-explorer/blob/main/.github/CONTRIBUTING.md"
        target="_blank"
        rel="noopener"
        ><span>$contribute</span> <span aria-hidden="true">↗</span></a
      >
      <a href="$doi_url" target="_blank" rel="noopener"
        >Zenodo <span aria-hidden="true">↗</span></a
      >
      <button
        type="button"
        class="siteFooterCopy"
        data-copy-citation
        data-citation="$citation_text"
        title="$copy_citation"
        aria-live="polite"
      >
        <span class="citationCopyReady">
          <span>$cite</span>
          <svg
            viewBox="0 0 20 20"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <rect x="7" y="7" width="10" height="11" rx="2" />
            <path d="M13 7V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3" />
          </svg>
        </span>
        <span class="citationCopyDone" hidden>
          <span>$copied</span>
          <svg
            viewBox="0 0 20 20"
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m4 10 4 4 8-8" />
          </svg>
        </span>
      </button>
    </nav>
  </div>
  <div class="siteFooterCitation" data-citation-fallback hidden>
    <p role="status">$copy_manual</p>
    <textarea readonly rows="4" aria-label="$citation_label">
$citation_text</textarea>
  </div>
</footer>

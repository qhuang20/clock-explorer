name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r .github/requirements.txt
      - run: ruff check analysis scripts tests
      - run: ruff format --check analysis scripts tests
      - run: npm run check
      - run: npm test
      - run: npm run format:check
      - run: npm run build

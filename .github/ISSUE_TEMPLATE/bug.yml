name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, browser, language and dataset
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or logs
      description: Remove private notes, paths and credentials.
